name: Check answers

# Runs every time you push, and can be started by hand from the Actions tab.
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Get the code
        uses: actions/checkout@v7

      - name: Set up Java 25 (Temurin)
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"

      - name: Compile
        run: javac -d out assignment/*.java checker/*.java

      - name: Run the checks and show the score
        run: java -cp out Checker
